<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณเพื่อคาดการณ์การเปลี่ยนแปลงน้ำหนัก - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คาดการณ์ระยะเวลาเพื่อไปถึงน้ำหนักเป้าหมาย</h2>
            <p>อยากรู้ว่าจะใช้เวลานานแค่ไหน? กรอกข้อมูลแผนของคุณเพื่อดูระยะเวลาโดยประมาณ</p>
            
            <div class="form-group">
                <label for="proj-unit">เลือกหน่วยน้ำหนัก</label>
                <select id="proj-unit">
                    <option value="kg" selected>กิโลกรัม (kg)</option>
                    <option value="lbs">ปอนด์ (lbs)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="current-weight">น้ำหนักปัจจุบัน</label>
                <input type="number" id="current-weight" min="1" placeholder="น้ำหนักเริ่มต้น">
            </div>
            
            <div class="form-group">
                <label for="goal-weight">น้ำหนักเป้าหมาย</label>
                <input type="number" id="goal-weight" min="1" placeholder="น้ำหนักที่ต้องการ">
            </div>

            <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

            <div class="form-group">
                <label for="proj-tdee">พลังงานที่ใช้รักษาน้ำหนัก (TDEE)</label>
                <input type="number" id="proj-tdee" min="1" placeholder="แคลอรี่ต่อวัน">
            </div>

            <div class="form-group">
                <label for="plan-calories">พลังงานที่จะกินตามแผน / วัน</label>
                <input type="number" id="plan-calories" min="1" placeholder="แคลอรี่ต่อวัน">
            </div>

            <button id="calculate-proj-btn" class="btn-primary">คำนวณระยะเวลา</button>

            <div id="proj-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="projection_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
