<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คู่มืออาหารเสริมเบื้องต้น - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คู่มืออาหารเสริมเบื้องต้น</h2>
            <p>เลือกอาหารเสริมที่คุณสนใจเพื่อดูข้อมูลเบื้องต้นและคำแนะนำการใช้งานทั่วไป</p>
            
            <div class="error" style="background-color: #fffbe6; border-color: #ffe58f; color: #d46b08; margin-bottom: 20px;">
                <strong>ข้อควรระวัง:</strong> ข้อมูลในหน้านี้เป็นเพียงข้อมูลเบื้องต้นเพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์ โปรดปรึกษาแพทย์หรือผู้เชี่ยวชาญก่อนการใช้อาหารเสริมทุกชนิด
            </div>

            <div class="form-group">
                <label for="supplement-select">เลือกอาหารเสริมที่ต้องการดูข้อมูล</label>
                <select id="supplement-select" style="width: 100%; padding: 12px; font-size: 1.1em;">
                    <option value="">-- กรุณาเลือก --</option>
                    <option value="protein">โปรตีน (Protein)</option>
                    <option value="creatine">ครีเอทีน (Creatine)</option>
                    <option value="bcaas">บีซีเอเอ (BCAAs)</option>
                </select>
            </div>

            <div id="supplement-info" style="margin-top: 20px;">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="supplement_guide.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
