<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือวางแผนการเพิ่มความหนัก - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>วางแผนการเพิ่มน้ำหนักฝึก (Load Progression)</h2>
            <p>สร้างแผนการเพิ่มน้ำหนักฝึกซ้อมในแต่ละสัปดาห์อย่างเป็นระบบเพื่อการพัฒนาที่ต่อเนื่อง</p>
            
            <div class="form-group">
                <label for="current-weight">น้ำหนักที่ใช้ฝึกปัจจุบัน</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="current-weight" min="1" placeholder="น้ำหนักเริ่มต้น" style="flex: 2;">
                    <select id="weight-unit" style="flex: 1;">
                        <option value="kg" selected>กก.</option>
                        <option value="lbs">ปอนด์</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="plan-weeks">จำนวนสัปดาห์ที่ต้องการวางแผน</label>
                <input type="number" id="plan-weeks" min="1" max="52" placeholder="เช่น 4, 8, 12">
            </div>

            <div class="form-group">
                <label for="increment-weight">น้ำหนักที่จะเพิ่มในแต่ละสัปดาห์</label>
                <input type="number" id="increment-weight" min="0" step="0.5" placeholder="เช่น 2.5">
            </div>

            <button id="calculate-plan-btn" class="btn-primary">สร้างแผนการฝึก</button>

            <div id="plan-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="progression_planner.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
