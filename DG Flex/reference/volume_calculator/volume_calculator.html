<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณ Volume การฝึกซ้อม - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        .exercise-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .exercise-row label {
            font-size: 0.8em;
            margin-bottom: 2px;
            color: #555;
        }
        .remove-btn {
            background-color: #ff4d4f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            line-height: 30px;
            text-align: center;
            align-self: end;
            margin-bottom: 5px;
        }
    </style>
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณปริมาณการฝึกโดยรวม (Workout Volume)</h2>
            <p>ติดตามความก้าวหน้าของคุณโดยการคำนวณ Volume ทั้งหมดในแต่ละโปรแกรมการฝึก</p>
            
            <div class="form-group">
                <label for="volume-unit">เลือกหน่วยน้ำหนัก</label>
                <select id="volume-unit">
                    <option value="kg" selected>กิโลกรัม (kg)</option>
                    <option value="lbs">ปอนด์ (lbs)</option>
                </select>
            </div>

            <div id="exercise-list">
                </div>

            <button id="add-exercise-btn" class="btn-primary" style="background-color: #1890ff; width: auto; padding: 10px 15px; margin-bottom: 20px;">+ เพิ่มท่าออกกำลังกาย</button>
            <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
            <button id="calculate-volume-btn" class="btn-primary">คำนวณ Volume ทั้งหมด</button>

            <div id="volume-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="volume_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>
</body>
</html>
