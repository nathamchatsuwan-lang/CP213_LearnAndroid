<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณสำหรับวันรีฟีด - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณสารอาหารสำหรับวันรีฟีด (Refeed Day)</h2>
            <p>วางแผนวันรีฟีดของคุณโดยการเพิ่มคาร์โบไฮเดรตเพื่อกระตุ้นการเผาผลาญและเติมพลังงาน</p>
            
            <div class="form-group">
                <label for="refeed-tdee">พลังงานสำหรับรักษาน้ำหนัก (TDEE)</label>
                <input type="number" id="refeed-tdee" min="1" placeholder="แคลอรี่ที่ใช้รักษาน้ำหนักตัว">
            </div>

            <div class="form-group">
                <label for="refeed-protein">โปรตีนที่ต้องการ (กรัม)</label>
                <input type="number" id="refeed-protein" min="1" placeholder="ปริมาณโปรตีนที่กินปกติ">
            </div>

            <div class="form-group">
                <label for="refeed-fat">ไขมันที่ต้องการ (กรัม)</label>
                <input type="number" id="refeed-fat" min="1" placeholder="เช่น 30-50 กรัม (ไขมันต่ำ)">
            </div>

            <button id="calculate-refeed-btn" class="btn-primary">คำนวณวันรีฟีด</button>

            <div id="refeed-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="refeed_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
