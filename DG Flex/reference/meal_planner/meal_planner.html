<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือวางแผนมื้ออาหาร - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>วางแผนเวลามื้ออาหาร (Meal Timing)</h2>
            <p>สร้างตารางเวลารับประทานอาหารตัวอย่าง โดยกระจายมื้ออาหารของคุณอย่างสม่ำเสมอตลอดทั้งวัน</p>
            
            <div class="form-group">
                <label for="wake-up-time">เวลาตื่นนอน</label>
                <input type="time" id="wake-up-time" value="07:00" style="padding: 12px; font-size: 1.2em;">
            </div>

            <div class="form-group">
                <label for="bed-time">เวลาเข้านอน</label>
                <input type="time" id="bed-time" value="23:00" style="padding: 12px; font-size: 1.2em;">
            </div>

            <div class="form-group">
                <label for="num-meals">จำนวนมื้ออาหารต่อวัน</label>
                <select id="num-meals" style="width: 100%; padding: 12px; font-size: 1.1em;">
                    <option value="3">3 มื้อ</option>
                    <option value="4">4 มื้อ</option>
                    <option value="5" selected>5 มื้อ</option>
                    <option value="6">6 มื้อ</option>
                </select>
            </div>


            <button id="calculate-plan-btn" class="btn-primary">สร้างตารางเวลา</button>

            <div id="meal-plan-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="meal_planner.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
