<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณเปอร์เซ็นต์ไขมัน & LBM - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณเปอร์เซ็นต์ไขมัน(BF%)<br>และมวลร่างกาย(LBM)</h2>
            <p>ประเมินสัดส่วนไขมันและมวลร่างกายที่ไม่ใช่ไขมัน (LBM) จากการวัดสัดส่วนและน้ำหนักตัวของคุณ</p>
            
            <div class="form-group">
                <label for="bfp-weight">น้ำหนักตัว (กก.)</label>
                <input type="number" id="bfp-weight" min="1" placeholder="เช่น 65">
            </div>

            <div class="form-group">
                <label for="units">เลือกหน่วยวัดสัดส่วน</label>
                <select id="units">
                    <option value="cm" selected>เซนติเมตร (cm)</option>
                    <option value="in">นิ้ว (inches)</option>
                </select>
            </div>

            <div class="form-group">
                <label>เพศ</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male">ชาย</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">หญิง</label>
                </div>
            </div>

            <div class="form-group">
                <label for="bfp-height">ส่วนสูง</label>
                <input type="number" id="bfp-height" min="1" placeholder="เช่น 170">
            </div>

            <div class="form-group">
                <label for="bfp-neck">รอบคอ</label>
                <input type="number" id="bfp-neck" min="1" placeholder="วัดบริเวณรอบลูกกระเดือก">
            </div>

            <div class="form-group">
                <label for="bfp-waist">รอบเอว</label>
                <input type="number" id="bfp-waist" min="1" placeholder="วัดที่ระดับสะดือ">
            </div>

            <div class="form-group" id="hip-group" style="display: none;">
                <label for="bfp-hip">รอบสะโพก</label>
                <input type="number" id="bfp-hip" min="1" placeholder="วัดส่วนที่กว้างที่สุดของสะโพก">
            </div>

            <button id="calculate-bfp-btn" class="btn-primary">คำนวณ</button>

            <div id="bfp-result" class="bmi-result-container">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="bfp_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
