<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณแผ่นน้ำหนัก - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        .plate-checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; }
        .plate-checkbox { display: flex; align-items: center; }
        .plate-result-container { display: flex; justify-content: center; gap: 20px; text-align: center; margin-top: 20px;}
        .side-plates { border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 45%; }
        .plate-item { font-size: 1.1em; font-weight: bold; color: #333; background-color: #f4f4f4; padding: 8px; border-radius: 5px; margin-bottom: 8px;}
    </style>
</head>
<body data-path-prefix<body>
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณแผ่นน้ำหนัก (Plate Calculator)</h2>
            <p>ไม่ต้องเสียเวลาคำนวณที่ยิม! กรอกน้ำหนักที่ต้องการยก แล้วเราจะบอกว่าต้องใส่แผ่นอะไรบ้าง</p>
            
             <div class="form-group">
                <label for="target-weight">น้ำหนักเป้าหมาย</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="target-weight" min="1" placeholder="เช่น 102.5" style="flex: 2;">
                    <select id="unit-select" style="flex: 1;">
                        <option value="kg" selected>กก.</option>
                        <option value="lbs">ปอนด์</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="bar-weight">น้ำหนักคานบาร์เบล</label>
                <select id="bar-weight" style="width: 100%; padding: 12px; font-size: 1.1em;"></select>
            </div>

            <div class="form-group">
                <label>แผ่นน้ำหนักที่มีให้ใช้ (ต่อข้าง)</label>
                <div id="plate-options" class="plate-checkbox-group"></div>
            </div>

            <button id="calculate-plates-btn" class="btn-primary">คำนวณ</button>

            <div id="plate-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="plate_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
