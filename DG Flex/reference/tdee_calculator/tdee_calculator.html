<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณ TDEE/BMR - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณแคลอรี่ที่ต้องการต่อวัน (TDEE)</h2>
            
            <div class="form-group">
                <label for="age">อายุ (ปี)</label>
                <input type="number" id="age" min="1" placeholder="เช่น 25">
            </div>

            <div class="form-group">
                <label>เพศ</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male">ชาย</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">หญิง</label>
                </div>
            </div>

            <div class="form-group">
                <label for="weight">น้ำหนัก (กก.)</label>
                <input type="number" id="weight" min="1" placeholder="เช่น 65">
            </div>

            <div class="form-group">
                <label for="height">ส่วนสูง (ซม.)</label>
                <input type="number" id="height" min="1" placeholder="เช่น 170">
            </div>
            
            <div class="form-group">
                <label for="activity-level">ระดับกิจกรรม</label>
                <select id="activity-level">
                    <option value="1.0">อัตราการเผาผลาญพื้นฐาน (BMR)</option>
                    <option value="1.2">ไม่ออกกำลังกายเลย</option>
                    <option value="1.375">ออกกำลังกายเบาๆ (1-3 วัน/สัปดาห์)</option>
                    <option value="1.465">ออกกำลังกายปานกลาง (4-5 วัน/สัปดาห์)</option>
                    <option value="1.55" selected>ออกกำลังกายหนัก (รายวัน หรือ 3-4 วัน/สัปดาห์)</option>
                    <option value="1.725">ออกกำลังกายหนักมาก (6-7 วัน/สัปดาห์)</option>
                    <option value="1.9">ออกกำลังกายหนักสุดๆ (ทุกวัน หรือทำงานใช้แรงงาน)</option>
                </select>
            </div>

            <button id="calculate-btn" class="btn-primary">คำนวณ</button>

            <div id="save-result-container" style="margin-top: 15px;"></div>

            <div id="result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>

    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script type="module" src="tdee_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>
</body>
</html>
