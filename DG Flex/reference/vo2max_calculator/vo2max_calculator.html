<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องประเมินค่า VO2 Max - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>ประเมินค่า VO2 Max (Rockport 1-Mile Walk Test)</h2>
            <div style="background-color: #f0faff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cce5ff;">
                <h4 style="margin-top:0;">วิธีทดสอบ:</h4>
                <ol style="padding-left: 20px; margin-bottom: 0;">
                    <li>หาเส้นทางเรียบระยะทาง 1 ไมล์ (ประมาณ 1.6 กิโลเมตร)</li>
                    <li>เดินให้เร็วที่สุดเท่าที่จะทำได้</li>
                    <li>เมื่อครบระยะทาง ให้จับเวลาทั้งหมดที่ใช้ และวัดชีพจรทันที</li>
                    <li>นำข้อมูลที่ได้มากรอกในฟอร์มด้านล่างนี้</li>
                </ol>
            </div>
            
            <div class="form-group">
                <label>เพศ</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male">ชาย</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">หญิง</label>
                </div>
            </div>

             <div class="form-group">
                <label for="vo2max-age">อายุ (ปี)</label>
                <input type="number" id="vo2max-age" min="1" placeholder="เช่น 35">
            </div>

            <div class="form-group">
                <label for="vo2max-weight">น้ำหนักตัว</label>
                 <div style="display: flex; gap: 10px;">
                    <input type="number" id="vo2max-weight" min="1" placeholder="กรอกน้ำหนัก" style="flex: 2;">
                    <select id="weight-units" style="flex: 1;">
                        <option value="kg" selected>กก.</option>
                        <option value="lbs">ปอนด์</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="walk-time-min">เวลาที่ใช้เดิน (1 ไมล์)</label>
                 <div style="display: flex; gap: 10px;">
                    <input type="number" id="walk-time-min" min="0" placeholder="นาที" style="flex: 1;">
                    <input type="number" id="walk-time-sec" min="0" max="59" placeholder="วินาที" style="flex: 1;">
                </div>
            </div>

            <div class="form-group">
                <label for="final-hr">อัตราการเต้นหัวใจ (ครั้งต่อนาที)</label>
                <input type="number" id="final-hr" min="1" placeholder="ชีพจรที่วัดได้หลังเดินเสร็จ">
            </div>

            <button id="calculate-vo2max-btn" class="btn-primary">ประเมินค่า VO2 Max</button>

            <div id="vo2max-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="vo2max_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
