<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณสัดส่วนสารอาหาร (Macros) - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณสัดส่วนสารอาหารหลัก (Macronutrients)</h2>
            <p>วางแผนการกินของคุณโดยแบ่งแคลอรี่ที่ต้องการต่อวันออกเป็นโปรตีน, คาร์โบไฮเดรต, และไขมัน</p>
            
            <div class="form-group">
                <label for="macro-calories">พลังงานรวมที่ต้องการต่อวัน (แคลอรี่)</label>
                <input type="number" id="macro-calories" min="1" placeholder="หาได้จากเครื่องคำนวณ TDEE">
            </div>

            <div class="form-group">
                <label for="macro-goal">เลือกแผนสารอาหาร</label>
                <select id="macro-goal">
                    <option value="balanced" selected>สมดุล (คาร์บ 40% / โปรตีน 30% / ไขมัน 30%)</option>
                    <option value="low-carb">คาร์โบไฮเดรตต่ำ (คาร์บ 25% / โปรตีน 45% / ไขมัน 30%)</option>
                    <option value="high-protein">โปรตีนสูง (คาร์บ 30% / โปรตีน 40% / ไขมัน 30%)</option>
                    <option value="custom">กำหนดเอง</option>
                </select>
            </div>
            
            <div id="custom-ratio-group" style="display: none; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                <p style="margin-top: 0; font-weight: bold;">กำหนดสัดส่วนเอง (รวมกันต้องได้ 100%)</p>
                <div class="form-group">
                    <label for="custom-carbs">คาร์โบไฮเดรต (%)</label>
                    <input type="number" id="custom-carbs" min="0" max="100" placeholder="เช่น 40">
                </div>
                 <div class="form-group">
                    <label for="custom-protein">โปรตีน (%)</label>
                    <input type="number" id="custom-protein" min="0" max="100" placeholder="เช่น 30">
                </div>
                 <div class="form-group">
                    <label for="custom-fat">ไขมัน (%)</label>
                    <input type="number" id="custom-fat" min="0" max="100" placeholder="เช่น 30">
                </div>
            </div>


            <button id="calculate-macro-btn" class="btn-primary">คำนวณ</button>

            <div id="macro-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="macro_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
