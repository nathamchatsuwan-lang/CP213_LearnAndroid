<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณ BMI - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณดัชนีมวลกาย (BMI)</h2>
            <p>ประเมินภาวะน้ำหนักของคุณจากค่าดัชนีมวลกาย เพื่อวางแผนการดูแลสุขภาพที่เหมาะสม</p>
            
            <div class="form-group">
                <label for="bmi-weight">น้ำหนัก (กก.)</label>
                <input type="number" id="bmi-weight" min="1" placeholder="เช่น 65">
            </div>

            <div class="form-group">
                <label for="bmi-height">ส่วนสูง (ซม.)</label>
                <input type="number" id="bmi-height" min="1" placeholder="เช่น 170">
            </div>

            <button id="calculate-bmi-btn" class="btn-primary">คำนวณ BMI</button>
            
            <div id="save-result-container" style="margin-top: 15px;"></div>

            <div id="bmi-result" class="bmi-result-container">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>

    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script type="module" src="bmi_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>
</body>
</html>
