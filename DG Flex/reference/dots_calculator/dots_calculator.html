<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณคะแนน DOTS - DG Gym</title>
    <link rel="stylesheet" href="../../asset/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body data-path-prefix="../../">
    <div id="preloader">
    <i id="loader" class="fas fa-dumbbell"></i>
</div>
    <header></header>
    <nav></nav>

    <main>
        <div class="calculator-container">
            <h2>คำนวณคะแนนความแข็งแกร่ง (DOTS Score)</h2>
            <p>เปรียบเทียบความแข็งแกร่งของคุณกับนักยกน้ำหนักคนอื่นๆ โดยใช้มาตรฐานสากล</p>
            
            <div class="form-group">
                <label>เพศ</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" checked> <label for="male">ชาย</label>
                    <input type="radio" id="female" name="gender" value="female"> <label for="female">หญิง</label>
                </div>
            </div>

            <div class="form-group">
                <label for="unit-select">เลือกหน่วยน้ำหนัก (สำหรับทุกช่อง)</label>
                <select id="unit-select" style="width: 100%; padding: 12px; font-size: 1.1em;">
                    <option value="kg" selected>กิโลกรัม (kg)</option>
                    <option value="lbs">ปอนด์ (lbs)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="body-weight">น้ำหนักตัว</label>
                <input type="number" id="body-weight" min="1" placeholder="น้ำหนักของคุณ">
            </div>

            <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
            <p style="text-align:center; font-weight:bold;">กรอกน้ำหนักที่ดีที่สุดที่ยกได้ 1 ครั้ง (1RM)</p>

            <div class="form-group">
                <label for="squat-weight">Squat</label>
                <input type="number" id="squat-weight" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="bench-weight">Bench Press</label>
                <input type="number" id="bench-weight" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="deadlift-weight">Deadlift</label>
                <input type="number" id="deadlift-weight" min="0" value="0">
            </div>

            <button id="calculate-dots-btn" class="btn-primary">คำนวณคะแนน DOTS</button>

            <div id="dots-result">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 DG Gym. All rights reserved.</p>
    </footer>
    <script type="module" src="../../asset/js/firebase-config.js"></script>
    <script src="dots_calculator.js"></script>
    <script type="module" src="../../asset/js/main.js"></script>

</body>
</html>
