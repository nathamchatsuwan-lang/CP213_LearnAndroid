<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Flex - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <div class="app-bar">
            <h1>PROFILE</h1>
            <i class="fa-solid fa-gear"></i>
        </div>

        <div class="content" style="text-align: center;">
            <div style="width: 100px; height: 100px; background: var(--glass-border); border-radius: 50%; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent-color);">
                <i class="fa-solid fa-user" style="font-size: 40px; color: var(--accent-color);"></i>
            </div>
            <h2 style="margin: 0;">John Doe</h2>
            <p class="text-subtitle">Advanced Lifter • Member since 2024</p>
            
            <div style="height: 30px;"></div>
            
            <div class="card glass" style="text-align: left;">
                <h4 style="margin: 0 0 15px 0;">Account Settings</h4>
                <div class="row" style="padding: 12px 0; border-bottom: 1px solid var(--glass-border); justify-content: space-between;">
                    <span style="font-size: 14px;">Personal Info</span>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: var(--text-secondary);"></i>
                </div>
                <div class="row" style="padding: 12px 0; border-bottom: 1px solid var(--glass-border); justify-content: space-between;">
                    <span style="font-size: 14px;">Notification Preferences</span>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: var(--text-secondary);"></i>
                </div>
                <div class="row" style="padding: 12px 0; justify-content: space-between;">
                    <span style="font-size: 14px;">Integrations (Google Fit)</span>
                    <div style="width: 30px; height: 16px; background: var(--accent-color); border-radius: 8px; position: relative;">
                        <div style="width: 12px; height: 12px; background: white; border-radius: 50%; position: absolute; right: 2px; top: 2px;"></div>
                    </div>
                </div>
            </div>

            <div class="card glass" style="text-align: left;">
                <h4 style="margin: 0 0 15px 0;">Subscription</h4>
                <div class="row" style="justify-content: space-between;">
                    <div>
                        <p style="margin: 0; font-size: 14px; font-weight: 800;">DG GOLD PLAN</p>
                        <p style="margin: 0; font-size: 10px; color: var(--text-secondary);">Next billing: Nov 12, 2026</p>
                    </div>
                    <div class="badge">ACTIVE</div>
                </div>
            </div>

            <div class="btn btn-outline" style="width: 100%; color: #FF4444; border-color: rgba(255,68,68,0.2);">LOG OUT</div>
        </div>

        <div class="bottom-bar">
            <a href="home.html" class="bottom-bar-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="history.html" class="bottom-bar-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>History</span>
            </a>
            <a href="workout.html" class="bottom-bar-item">
                <div style="background: var(--accent-color); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 10px rgba(255,0,51,0.4);">
                    <i class="fa-solid fa-plus" style="color: white; font-size: 20px;"></i>
                </div>
            </a>
            <a href="statistics.html" class="bottom-bar-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Stats</span>
            </a>
            <a href="profile.html" class="bottom-bar-item active">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
