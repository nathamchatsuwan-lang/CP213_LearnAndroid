<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Flex - History</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <div class="app-bar">
            <h1>HISTORY</h1>
            <i class="fa-solid fa-calendar"></i>
        </div>

        <div class="content">
            <h3 style="margin: 0 0 var(--spacing-md) 0;">October 2026</h3>
            
            <div class="card glass">
                <div class="row" style="justify-content: space-between; margin-bottom: 5px;">
                    <span style="font-weight: 800;">Push Day</span>
                    <span style="color: var(--text-secondary); font-size: 12px;">Oct 24, 10:15 AM</span>
                </div>
                <p class="text-subtitle">12 Exercises • 45m 12s • 8.4t Volume</p>
                <div style="height: 10px;"></div>
                <div class="row" style="gap: 5px;">
                    <div style="width: 30px; height: 30px; background: var(--surface-light); border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-dumbbell" style="font-size: 12px;"></i></div>
                    <div style="width: 30px; height: 30px; background: var(--surface-light); border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-bolt" style="font-size: 12px;"></i></div>
                </div>
            </div>

            <div class="card glass">
                <div class="row" style="justify-content: space-between; margin-bottom: 5px;">
                    <span style="font-weight: 800;">Pull Day</span>
                    <span style="color: var(--text-secondary); font-size: 12px;">Oct 22, 05:30 PM</span>
                </div>
                <p class="text-subtitle">10 Exercises • 52m 40s • 7.2t Volume</p>
            </div>

            <div class="card glass">
                <div class="row" style="justify-content: space-between; margin-bottom: 5px;">
                    <span style="font-weight: 800;">Leg Day (Quads)</span>
                    <span style="color: var(--text-secondary); font-size: 12px;">Oct 20, 09:00 AM</span>
                </div>
                <p class="text-subtitle">8 Exercises • 1h 05m • 15.4t Volume</p>
            </div>
        </div>

        <div class="bottom-bar">
            <a href="home.html" class="bottom-bar-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="history.html" class="bottom-bar-item active">
                <i class="fa-solid fa-calendar-days"></i>
                <span>History</span>
            </a>
            <a href="workout.html" class="bottom-bar-item">
                <div style="background: var(--accent-color); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 10px rgba(255,0,51,0.4);">
                    <i class="fa-solid fa-plus" style="color: white; font-size: 20px;"></i>
                </div>
            </a>
            <a href="statistics.html" class="bottom-bar-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Stats</span>
            </a>
            <a href="profile.html" class="bottom-bar-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
