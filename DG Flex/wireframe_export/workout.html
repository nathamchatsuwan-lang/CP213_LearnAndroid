<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Flex - Active Workout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <div class="app-bar" style="padding-bottom: var(--spacing-sm);">
            <div class="row">
                <i class="fa-solid fa-xmark" style="font-size: 20px;"></i>
                <div style="width: 15px;"></div>
                <div>
                    <h1 style="font-size: 16px;">PUSH DAY</h1>
                    <p style="font-size: 10px; color: var(--text-secondary); margin: 0;">Session #24</p>
                </div>
            </div>
            <div class="row" style="gap: 8px;">
                <div style="background: var(--surface-light); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-family: monospace; border: 1px solid var(--glass-border);">00:42:15</div>
                <div class="btn btn-primary" style="padding: 6px 12px; border-radius: 20px; font-size: 11px;">FINISH</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div style="width: 100%; height: 2px; background: var(--glass-border);">
            <div style="width: 40%; height: 100%; background: var(--accent-color);"></div>
        </div>

        <div class="content">
            <!-- Exercise Media Placeholder -->
            <div style="width: 100%; height: 200px; background: var(--surface-light); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid var(--glass-border);">
                <i class="fa-solid fa-play-circle" style="font-size: 48px; color: white; opacity: 0.2; z-index: 1;"></i>
                <div style="position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 10px;">
                    <i class="fa-solid fa-video"></i> Tutorial
                </div>
            </div>

            <div class="card glass" style="margin-bottom: var(--spacing-md);">
                <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                    <div>
                        <h2 style="margin: 0; font-size: 20px; color: var(--accent-color);">Barbell Bench Press</h2>
                        <p class="text-subtitle" style="font-size: 12px;">Equipment: Barbell</p>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical" style="opacity: 0.5; padding: 10px;"></i>
                </div>
                
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="color: var(--text-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: 1px;">
                            <th style="padding-bottom: 12px; font-weight: 400;">Set</th>
                            <th style="padding-bottom: 12px; font-weight: 400;">Previous</th>
                            <th style="padding-bottom: 12px; font-weight: 400;">Weight</th>
                            <th style="padding-bottom: 12px; font-weight: 400;">Reps</th>
                            <th style="padding-bottom: 12px; font-weight: 400; text-align: center;">Done</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid var(--glass-border);">
                            <td style="padding: 16px 0; font-weight: 800; color: var(--accent-color);">1</td>
                            <td style="padding: 16px 0; color: var(--text-secondary); font-size: 12px;">80 x 10</td>
                            <td style="padding: 16px 0;"><input type="text" value="85" style="background: var(--surface-light); border: 1px solid var(--glass-border); color: white; width: 50px; padding: 8px; border-radius: 6px; text-align: center; font-weight: 600;"></td>
                            <td style="padding: 16px 0;"><input type="text" value="8" style="background: var(--surface-light); border: 1px solid var(--glass-border); color: white; width: 50px; padding: 8px; border-radius: 6px; text-align: center; font-weight: 600;"></td>
                            <td style="padding: 16px 0; text-align: center;"><div style="width: 24px; height: 24px; background: var(--accent-color); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: white;"><i class="fa-solid fa-check" style="font-size: 12px;"></i></div></td>
                        </tr>
                        <tr>
                            <td style="padding: 16px 0; font-weight: 800; color: var(--text-secondary);">2</td>
                            <td style="padding: 16px 0; color: var(--text-secondary); font-size: 12px;">80 x 10</td>
                            <td style="padding: 16px 0;"><input type="text" value="85" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-secondary); width: 50px; padding: 8px; border-radius: 6px; text-align: center;"></td>
                            <td style="padding: 16px 0;"><input type="text" value="8" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-secondary); width: 50px; padding: 8px; border-radius: 6px; text-align: center;"></td>
                            <td style="padding: 16px 0; text-align: center;"><div style="width: 24px; height: 24px; border: 2px solid var(--glass-border); border-radius: 6px; display: inline-flex;"></div></td>
                        </tr>
                    </tbody>
                </table>
                
                <div style="height: 20px;"></div>
                <div class="btn" style="width: 100%; background: var(--glass-bg); border: 1px dashed var(--glass-border); color: var(--text-secondary); font-size: 13px;">+ Add Set</div>
            </div>

            <!-- Rest Timer Overlay Placeholder -->
            <div style="background: var(--accent-color); color: white; padding: 12px 20px; border-radius: 30px; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 8px 20px rgba(255,0,51,0.3); margin: 0 auto; display: flex; width: fit-content;">
                <i class="fa-solid fa-stopwatch"></i>
                <span style="font-weight: 800; font-family: monospace; font-size: 16px;">01:24</span>
                <span style="opacity: 0.8; font-size: 11px;">Resting...</span>
                <div style="width: 20px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-plus" style="font-size: 10px;"></i></div>
            </div>

            <div class="card" style="margin-top: 24px; opacity: 0.5;">
                <h3 style="margin: 0 0 5px 0; font-size: 16px;">Incline Dumbbell Fly</h3>
                <p class="text-subtitle" style="font-size: 12px;">Next Exercise</p>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div style="padding: var(--spacing-md); display: flex; gap: 12px; background: var(--bg-color);">
            <div class="btn btn-outline" style="flex: 1;"><i class="fa-solid fa-chevron-left"></i> Previous</div>
            <div class="btn btn-primary" style="flex: 1;">Next <i class="fa-solid fa-chevron-right"></i></div>
        </div>
    </div>
</body>
</html>
