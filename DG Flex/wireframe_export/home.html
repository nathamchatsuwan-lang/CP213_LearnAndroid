<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Flex - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <div class="app-bar">
            <h1>DG FLEX</h1>
            <div class="row">
                <i class="fa-regular fa-bell"></i>
                <div style="width: 15px;"></div>
                <i class="fa-regular fa-user-circle"></i>
            </div>
        </div>

        <div class="content">
            <div class="hero">
                <img src="fitness_app_hero_1777347893349.png" alt="Workout">
                <div class="hero-overlay">
                    <span class="badge">Trending</span>
                    <h2 class="text-title">Hypertrophy Max</h2>
                    <p class="text-subtitle">4 Weeks • Advanced • 5 Days/Week</p>
                </div>
            </div>

            <div class="row" style="justify-content: space-between; align-items: flex-end; margin-bottom: var(--spacing-md);">
                <h3 style="margin: 0;">My Programs</h3>
                <a href="#" style="color: var(--accent-color); font-size: 12px; text-decoration: none; font-weight: 600;">View All</a>
            </div>

            <div class="card">
                <div class="row" style="justify-content: space-between;">
                    <div>
                        <h4 style="margin: 0 0 5px 0;">Push Day (Chest/Triceps)</h4>
                        <p class="text-subtitle">Next: Bench Press Focus</p>
                    </div>
                    <div class="btn btn-primary" style="padding: 8px 16px;">Start</div>
                </div>
                <div style="height: 10px;"></div>
                <div style="background: var(--glass-border); height: 4px; border-radius: 2px;">
                    <div style="background: var(--accent-color); width: 65%; height: 100%; border-radius: 2px;"></div>
                </div>
                <div style="height: 5px;"></div>
                <p style="font-size: 10px; color: var(--text-secondary); text-align: right;">65% Completed</p>
            </div>

            <h3 style="margin: var(--spacing-lg) 0 var(--spacing-md) 0;">Daily Stats</h3>
            <div class="grid-2">
                <div class="card">
                    <p class="stats-label">Calories</p>
                    <p class="stats-value">840</p>
                    <p class="text-subtitle">kcal</p>
                </div>
                <div class="card">
                    <p class="stats-label">Volume</p>
                    <p class="stats-value">12.4</p>
                    <p class="text-subtitle">tons</p>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <a href="home.html" class="bottom-bar-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="history.html" class="bottom-bar-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>History</span>
            </a>
            <a href="workout.html" class="bottom-bar-item">
                <div style="background: var(--accent-color); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 10px rgba(255,0,51,0.4);">
                    <i class="fa-solid fa-plus" style="color: white; font-size: 20px;"></i>
                </div>
            </a>
            <a href="statistics.html" class="bottom-bar-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Stats</span>
            </a>
            <a href="profile.html" class="bottom-bar-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
